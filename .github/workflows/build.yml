name: Compilar BagoNX

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar librerías de la Switch
        run: dkp-pacman -Sy --noconfirm --needed switch-sdl2 switch-sdl2_ttf switch-freetype switch-curl switch-zlib

      - name: Compilar
        run: make -j"$(nproc)" UPDATE_REPO="${{ github.repository }}"

      - name: Subir el .nro como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: bagonx
          path: bagonx.nro

      - name: Publicar release (solo en etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bagonx.nro
